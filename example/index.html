<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANA FLOWER · 김하나 대표 플로리스트</title>
<meta name="description" content="HANA FLOWER 김하나의 모바일 명함입니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://songbyeongseung11-max.github.io/mobile-card-maker/example/">
<meta property="og:title" content="HANA FLOWER · 김하나 대표 플로리스트">
<meta property="og:description" content="눌러서 연락처를 저장하세요.">
<meta property="og:image" content="https://songbyeongseung11-max.github.io/mobile-card-maker/example/img/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 에디토리얼(뉴욕) 명함: 크림 바탕, 검정 글씨, 포인트 색 하나. 투톤은 사진 아래 1/3부터 색 배경 */
  :root{--bg:#FFFFFF;--accent:#0B2FA3;--tone:#1F3B70;--ink:#111;--sub:#5d5a55;--hair:rgba(0,0,0,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:Montserrat,Pretendard,"Malgun Gothic",-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  [hidden]{display:none!important}
  svg{width:20px;height:20px;flex:none}
  .wrap{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 6px}
  .brand img{display:block;max-height:40px;max-width:180px}
  .co{font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1}
  .cosub{margin-top:4px;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
  .ic{display:flex;gap:8px}
  .ti{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.07);color:var(--ink);border:0;cursor:pointer;text-decoration:none}
  .ti svg{width:18px;height:18px}
  .ti.ok{background:var(--accent);color:#fff}
  .hero{padding:26px 0 0;position:relative;z-index:2}
  .ph{position:relative;width:176px;height:176px;margin:0 auto}
  .ph::before{content:"";position:absolute;inset:12px -14px -14px 12px;border:2px solid var(--accent);border-radius:4px}
  .ph img,.ph .ini{position:relative;width:100%;height:100%;object-fit:cover;border-radius:22px;transform:rotate(-5deg);box-shadow:0 12px 28px rgba(0,0,0,.22);background:#d9d6d0}
  .ph .ini{display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff;background:var(--ink)}
  .lower{padding:34px 22px 34px;text-align:center;flex:1}
  .name{font-size:34px;font-weight:800;letter-spacing:.01em;line-height:1.1;text-transform:uppercase;color:var(--ink);word-break:keep-all}
  .role{margin-top:8px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
  .place{margin-top:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
  .pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 18px;border-radius:999px;background:#111;color:#fff;font-size:15px;font-weight:600;text-decoration:none;letter-spacing:.02em}
  .pill svg{width:16px;height:16px}
  .greet{margin-top:14px;font-family:Pretendard,sans-serif;font-size:14px;line-height:1.7;color:var(--sub);word-break:keep-all}
  .list{margin-top:20px;border-top:1px solid var(--hair);text-align:left}
  .row{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid var(--hair);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:.02em}
  .row svg{width:34px;height:34px;padding:8px;border-radius:50%;background:var(--accent);color:#fff;stroke-width:2}
  .row span{word-break:break-all}
  .sns{margin-top:22px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
  .sn{display:grid;justify-items:center;gap:7px;text-decoration:none;color:var(--ink);font-family:Pretendard,sans-serif;font-size:11.5px;font-weight:600}
  .sn i{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.14)}
  .sn i svg{width:30px;height:30px}
  .sn i.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .sn i.blog{background:#03C75A}
  .sn i.yt{background:#FF0033}
  .sn i.web{background:#111}
  .acts{margin-top:20px;display:grid;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:6px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:0;font-family:inherit;cursor:pointer}
  .btn.solid{background:var(--accent);color:#fff}
  .btn.line{background:transparent;color:var(--ink);border:1.6px solid var(--ink);letter-spacing:.04em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lbl{margin-top:26px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--ink)}
  .grid{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .shot{aspect-ratio:1;border:0;padding:0;border-radius:8px;overflow:hidden;background:#ccc;cursor:zoom-in}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
  .lb img{max-width:100%;max-height:100%;border-radius:8px}
  .lb-x{position:absolute;top:12px;right:16px;background:none;border:0;color:#fff;font-size:36px;line-height:1;cursor:pointer}
  .foot{padding:4px 0 26px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--sub)}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><p class="co">HANA FLOWER</p><p class="cosub">WEDDING · EVENT · CLASS</p></div>
    <nav class="ic"><a class="ti" href="contact.vcf" download="김하나.vcf" aria-label="연락처 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></a><button class="ti" id="shareBtn" type="button" aria-label="링크 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button></nav>
  </header>
  <div class="hero"><div class="ph"><img src="img/photo.jpg" alt="김하나 사진"></div></div>
  <section class="lower">
    <h1 class="name">김하나</h1>
    <p class="role">대표 플로리스트</p>
    <a class="pill" href="tel:01000000000"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>010-0000-0000</a>
    <div class="list">
      <a class="row" href="tel:020000000"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h4v8H7zM14 9h3M14 12h3M14 15h3"/></svg><span>02-000-0000</span></a>
      <a class="row" href="mailto:hello@example.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>hello@example.com</span></a>
      <a class="row" href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%EC%8B%9C%20%EC%A4%91%EA%B5%AC%20%EC%84%B8%EC%A2%85%EB%8C%80%EB%A1%9C%20110" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>서울시 중구 세종대로 110</span></a>
      <a class="row" href="https://example.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>example.com</span></a>
    </div>
    <div class="sns"><a class="sn" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="인스타그램"><i class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.7"/><circle cx="16.9" cy="7.1" r="1.1" fill="#fff" stroke="none"/></svg></i><b>인스타그램</b></a><a class="sn" href="https://blog.naver.com/" target="_blank" rel="noopener" aria-label="블로그"><i class="blog"><svg viewBox="0 0 24 24"><text x="12" y="15.8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.6" font-weight="900" fill="#fff">blog</text></svg></i><b>블로그</b></a><a class="sn" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="유튜브"><i class="yt"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12.5" rx="4" fill="#fff"/><path d="M10.2 9.3v6l5.1-3z" fill="#FF0033"/></svg></i><b>유튜브</b></a><a class="sn" href="https://example.com/" target="_blank" rel="noopener" aria-label="홈페이지"><i class="web"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5a13 13 0 0 1 0 17M12 3.5a13 13 0 0 0 0 17"/></svg></i><b>홈페이지</b></a></div>
    <div class="acts">
      <a class="btn solid" href="contact.vcf" download="김하나.vcf">연락처 저장</a>
      <div class="two"><a class="btn line" href="tel:01000000000">전화하기</a><a class="btn line" href="sms:01000000000">문자하기</a></div>
      <a class="btn line" href="https://example.com/class" target="_blank" rel="noopener">클래스 · 행사 안내문</a>
    </div>
      <p class="lbl">사진 · PROJECTS</p>
      <div class="grid">
        <button class="shot" type="button"><img src="img/gallery/01.jpg" alt="사진 1" loading="lazy"></button>
        <button class="shot" type="button"><img src="img/gallery/02.jpg" alt="사진 2" loading="lazy"></button>
        <button class="shot" type="button"><img src="img/gallery/03.jpg" alt="사진 3" loading="lazy"></button>
      </div>
  </section>
  <p class="foot">HANA FLOWER</p>
</main>
<div class="lb" id="lb" hidden><button class="lb-x" type="button" aria-label="닫기">×</button><img id="lbImg" alt=""></div>
<script>
(function(){
  var sb = document.getElementById("shareBtn");
  sb.addEventListener("click", function(){
    var u = location.href.split("#")[0];
    if (navigator.share) { navigator.share({ title: document.title, url: u }).catch(function(){}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ sb.classList.add("ok"); setTimeout(function(){ sb.classList.remove("ok"); }, 1500); });
  });
  var lb = document.getElementById("lb"), im = document.getElementById("lbImg");
  document.querySelectorAll(".shot").forEach(function(b){ b.addEventListener("click", function(){ im.src = b.querySelector("img").src; lb.hidden = false; }); });
  lb.addEventListener("click", function(){ lb.hidden = true; im.src = ""; });
})();
</script>
</body>
</html>
