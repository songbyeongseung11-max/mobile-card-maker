<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하나 플라워 스튜디오 · 김하나 플로리스트</title>
<meta name="description" content="하나 플라워 스튜디오 김하나의 모바일 명함입니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://songbyeongseung11-max.github.io/mobile-card-maker/example/">
<meta property="og:title" content="하나 플라워 스튜디오 · 김하나 플로리스트">
<meta property="og:description" content="눌러서 연락처를 저장하세요.">
<meta property="og:image" content="https://songbyeongseung11-max.github.io/mobile-card-maker/example/img/share.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#F6ECE6;--paper:#FFFFFFE6;--ink:#1A1818;--sub:#6F6962;--line:#00000014;--accent:#D65C6E}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:Pretendard,"Malgun Gothic",-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  [hidden]{display:none!important}
  .wrap{max-width:440px;margin:0 auto;padding:28px 20px 40px;display:grid;gap:16px}
  .card{background:var(--paper);border-radius:22px;padding:28px 24px 26px;box-shadow:0 12px 32px rgba(60,40,20,.08)}
  .logo{display:block;max-width:78%;max-height:240px;margin:0 auto 6px}
  .company{text-align:center;font-size:22px;font-weight:700;letter-spacing:.04em}
  .company small{display:block;margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.3em;color:var(--accent)}
  .greet{margin:22px 4px 24px;font-size:15px;line-height:1.75;color:#3A3633;text-align:center;word-break:keep-all}
  .person{border-top:1px solid var(--line);padding-top:22px;text-align:center}
  .avatar{display:block;width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .name{font-size:26px;font-weight:700;letter-spacing:.08em}
  .title{margin-top:6px;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.12em}
  .phone{display:inline-block;margin-top:16px;font-size:19px;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:.03em}
  .mail{display:block;margin-top:8px;font-size:15px;color:var(--ink);text-decoration:none;word-break:break-all}
  .actions,.links{margin-top:22px;display:grid;gap:10px}
  .links{margin-top:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;border:0;font-family:inherit;cursor:pointer;width:100%}
  .btn svg{width:20px;height:20px;flex:none}
  .primary{background:var(--accent);color:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .kakao{background:#FEE500;color:#191919}
  .gal{padding:22px 0 18px}
  .gal h2{font-size:16px;margin:0 24px 12px}
  .strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 24px 6px;-webkit-overflow-scrolling:touch}
  .shot{flex:0 0 78%;aspect-ratio:4/3;border:0;padding:0;border-radius:14px;overflow:hidden;scroll-snap-align:center;background:#eee;cursor:zoom-in}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .gal-hint{margin:8px 24px 0;font-size:12px;color:var(--sub)}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
  .lb img{max-width:100%;max-height:100%;border-radius:8px}
  .lb-x{position:absolute;top:12px;right:16px;background:none;border:0;color:#fff;font-size:36px;line-height:1;cursor:pointer}
  .foot{text-align:center;margin-top:10px;font-size:12px;color:var(--sub);letter-spacing:.2em}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <p class="company">하나 플라워 스튜디오<small>HANA FLOWER STUDIO</small></p>
    <p class="greet">
      안녕하세요, 하나 플라워입니다.<br>
      꽃으로 특별한 날을 더 아름답게<br>
      만들어 드릴게요.
    </p>
    <div class="person">
      <img class="avatar" src="img/photo.jpg" alt="김하나 사진">
      <div class="name">김하나</div>
      <div class="title">플로리스트</div>
      <a class="phone" href="tel:01000000000">010-0000-0000</a>
      <a class="mail" href="mailto:hello@example.com">hello@example.com</a>
    </div>
    <div class="actions">
      <a class="btn primary" href="contact.vcf" download="김하나.vcf">연락처 저장하기</a>
      <div class="row">
        <a class="btn ghost" href="tel:01000000000">전화하기</a>
        <a class="btn ghost" href="sms:01000000000">문자하기</a>
      </div>
    </div>
    <div class="links">
      <a class="btn ghost" href="https://www.instagram.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>인스타그램</a>
      <a class="btn ghost" href="https://example.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>홈페이지</a>
      <a class="btn ghost" href="https://example.com/class" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>클래스 · 행사 안내문</a>
    </div>
  </section>
  <section class="card gal">
    <h2>사진</h2>
    <div class="strip">
      <button class="shot" type="button" data-i="0"><img src="img/gallery/01.jpg" alt="사진 1" loading="lazy"></button>
      <button class="shot" type="button" data-i="1"><img src="img/gallery/02.jpg" alt="사진 2" loading="lazy"></button>
      <button class="shot" type="button" data-i="2"><img src="img/gallery/03.jpg" alt="사진 3" loading="lazy"></button>
      <button class="shot" type="button" data-i="3"><img src="img/gallery/04.jpg" alt="사진 4" loading="lazy"></button>
    </div>
    <p class="gal-hint">옆으로 넘겨 보고, 누르면 크게 볼 수 있어요</p>
  </section>
  <div class="lb" id="lb" hidden><button class="lb-x" type="button" aria-label="닫기">×</button><img id="lbImg" alt=""></div>
  <p class="foot">HANA FLOWER STUDIO</p>
</main>
<script>
  (function(){
    var lb = document.getElementById("lb"), im = document.getElementById("lbImg");
    document.querySelectorAll(".shot").forEach(function(b){ b.addEventListener("click", function(){ im.src = b.querySelector("img").src; lb.hidden = false; }); });
    lb.addEventListener("click", function(){ lb.hidden = true; im.src = ""; });
  })();
</script>
</body>
</html>
